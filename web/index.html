<!DOCTYPE html>
<html>
<head>
  <!-- This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sakha Radio - онлайн радио">
  <meta name="theme-color" content="#0A0A0A">
  
  <!-- CSP для веб-версии - разрешаем все необходимые ресурсы -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval'
      blob:
      data:
      https://*.googleapis.com
      https://*.gstatic.com
      https://*.firebaseio.com
      https://*.google-analytics.com
      https://*.analytics.google.com
      https://*.googletagmanager.com
      https://lottie.host
      https://cdn.jsdelivr.net;
    script-src 'self' 'unsafe-inline' 'unsafe-eval'
      blob:
      https://*.googleapis.com
      https://*.gstatic.com
      https://*.firebaseio.com
      https://lottie.host
      https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline'
      https://*.googleapis.com;
    font-src 'self' data:
      https://*.googleapis.com
      https://*.gstatic.com;
    img-src 'self' data: blob: https:;
    media-src 'self' blob: data: https: http:;
    connect-src 'self'
      blob:
      https://*.googleapis.com
      https://*.gstatic.com
      https://*.firebaseio.com
      https://*.google-analytics.com
      https://api.rss2json.com
      https://api.openweathermap.org
      https://api.api-ninjas.com
      https://api.apiverve.com
      https://lottie.host
      https://cdn.jsdelivr.net
      https://www.gstatic.com
      https://*.hostingradio.ru
      https://*.cdnvideo.ru
      https://*.nip.io;
    frame-src 'self' https:;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SakhaLive Radio">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-orientation" content="any">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SakhaLive Radio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0A0A0A; /* Твой цвет фона из AppColors */
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Адаптация под ориентацию устройства */
    @media screen and (orientation: landscape) {
      /* Горизонтальная ориентация - центрируем контент */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
